name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format pkg-config libzip-dev

    - name: Check Code Formatting
      run: |
        find core cli -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) | xargs -r clang-format --dry-run --Werror
        
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Compile LaTeX Documentation
      uses: xu-cheng/latex-action@v3
      with:
        root_file: RetroForge_Base_Dark.tex
        working_directory: docs
        compiler: latexmk
        args: -pdf -interaction=nonstopmode

    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RetroForge-Livro
        path: docs/RetroForge_Base_Dark.pdf
